<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05030c">
<title>Огонёк — Liquid Glass 3D</title>

<!-- Telegram WebApp SDK -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  :root{
    --accent:#ff7a2a;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-l:env(safe-area-inset-left,0px);
    --safe-r:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#05030c;color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
  }
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

  /* ===== iOS-style liquid glass ===== */
  .glass{
    background:
      linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.07) 45%,rgba(255,255,255,.14) 100%);
    -webkit-backdrop-filter:blur(24px) saturate(1.8);
    backdrop-filter:blur(24px) saturate(1.8);
    border:1px solid rgba(255,255,255,.24);
    box-shadow:
      0 10px 34px rgba(0,0,0,.38),
      inset 0 1px 0 rgba(255,255,255,.5),
      inset 0 -1px 0 rgba(255,255,255,.08),
      inset 0 0 22px rgba(255,255,255,.05);
  }

  #top{
    position:fixed;left:calc(12px + var(--safe-l));top:calc(10px + var(--safe-t));
    display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:999px;
    font-size:14px;font-weight:650;letter-spacing:.2px;pointer-events:none;
  }
  #top i{
    width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--accent) 60%);
    box-shadow:0 0 12px var(--accent),0 0 3px #fff;transition:background .4s,box-shadow .4s;
  }

  #hint{
    position:fixed;left:50%;transform:translateX(-50%);
    top:calc(58px + var(--safe-t));padding:7px 14px;border-radius:999px;
    font-size:12px;color:rgba(255,255,255,.82);white-space:nowrap;pointer-events:none;
    transition:opacity .7s ease;
  }
  #hint.off{opacity:0}

  #dock{
    position:fixed;left:calc(10px + var(--safe-l));right:calc(10px + var(--safe-r));
    bottom:calc(10px + var(--safe-b));max-width:520px;margin:0 auto;
    padding:10px;border-radius:26px;display:flex;flex-direction:column;gap:8px;
  }
  .row{display:grid;gap:6px}
  #skins{grid-template-columns:repeat(4,1fr)}
  #accs{grid-template-columns:repeat(3,1fr)}

  .btn{
    appearance:none;-webkit-appearance:none;font:inherit;color:#fff;cursor:pointer;
    border:1px solid rgba(255,255,255,.16);border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
    padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-height:46px;transition:transform .15s ease,background .25s,border-color .25s,box-shadow .25s;
    touch-action:manipulation;
  }
  .btn:active{transform:scale(.94)}
  .btn b{font-size:12.5px;font-weight:650;letter-spacing:.1px;white-space:nowrap}
  .btn small{font-size:9.5px;opacity:.62;white-space:nowrap}
  .btn.on{
    border-color:rgba(255,255,255,.6);
    background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.08));
    box-shadow:0 0 18px -2px var(--accent),inset 0 1px 0 rgba(255,255,255,.55);
  }
  #accs .btn{flex-direction:row;gap:6px;min-height:40px}
  #accs .btn b{font-size:12.5px}
  .btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

  #loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#05030c;font-size:15px;color:rgba(255,255,255,.7);z-index:10;
    transition:opacity .6s ease;
  }
  #loader.off{opacity:0;pointer-events:none}
  @media (max-width:360px){.btn b{font-size:11.5px}.btn small{display:none}}
  @media (prefers-reduced-motion:reduce){.btn,#hint{transition:none}}
</style>

    <button class="btn" data-skin="neon"><b>⚡ Неон</b><small>Cyan/Purple</small></button>

  </div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   Telegram
   ========================================================= */
const tg = window.Telegram && window.Telegram.WebApp;
try {
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor('#05030c');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#05030c');
  }
} catch (e) { /* старый клиент Telegram */ }
const haptic = (s = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(s); } catch (e) {} };
const hapticSelect = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

/* =========================================================
   Utils
   ========================================================= */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

const canvas = document.getElementById('c');
const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                 (navigator.maxTouchPoints > 1 && Math.min(innerWidth, innerHeight) < 900);
const DPR = Math.min(window.devicePixelRatio || 1, 2);

let renderer;
try {
  renderer = new THREE.WebGLRenderer({
    canvas, antialias: false, alpha: false, stencil: false,
    powerPreference: 'high-performance'
  });
} catch (err) {
  document.getElementById('loader').textContent = 'WebGL недоступен на этом устройстве';
  throw err;
}
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03020a);

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 200);

/* =========================================================
   Skins
   ========================================================= */
const SKINS = {
  classic: { inner: 0xffe65a, outer: 0xff3b0f, tint: 0xffb766, rim: 0xff8a3c, sA: 0xffe27a, sB: 0xff4a14, light: 0xff8a3a, bg: 0x4a1604, accent: '#ff7a2a', eye: ['#ffd36b', '#e0731c', '#6a2408'] },
  neon:    { inner: 0x5ff8ff, outer: 0xb23cff, tint: 0xa58bff, rim: 0xc455ff, sA: 0x62f4ff, sB: 0xc24dff, light: 0x9a6bff, bg: 0x1d0a48, accent: '#b36bff', eye: ['#9ffcff', '#3aa8ff', '#3a1a7a'] },
  ice:     { inner: 0xd8fbff, outer: 0x1f63ff, tint: 0x8fd0ff, rim: 0x58b4ff, sA: 0xcff6ff, sB: 0x3d8bff, light: 0x6fb8ff, bg: 0x06214a, accent: '#5cb8ff', eye: ['#d6f6ff', '#4fa6ff', '#143a8a'] },
  phoenix: { inner: 0xffd53d, outer: 0xe3102e, tint: 0xffa840, rim: 0xff3548, sA: 0xffd84f, sB: 0xff2a3a, light: 0xffa23a, bg: 0x4a0a14, accent: '#ffc233', eye: ['#ffe27a', '#e8a21a', '#7a1420'] }
};
const COLOR_KEYS = ['inner', 'outer', 'tint', 'rim', 'sA', 'sB', 'light', 'bg'];
let skinName = 'classic';
const cur = {}, tgt = {};
COLOR_KEYS.forEach(k => { cur[k] = new THREE.Color(SKINS.classic[k]); tgt[k] = new THREE.Color(SKINS.classic[k]); });

/* =========================================================
   Environment map (procedural studio, PMREM)
   ========================================================= */
function buildEnvironment() {
  const env = new THREE.Scene();
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(60, 32, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false,
      vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
      fragmentShader: `varying vec3 vP; void main(){
        float h = vP.y*0.5+0.5;
        vec3 bot = vec3(0.02,0.02,0.05);
        vec3 hor = vec3(0.40,0.26,0.22);
        vec3 top = vec3(0.10,0.13,0.30);
        vec3 c = mix(bot,hor,smoothstep(0.0,0.5,h));
        c = mix(c,top,smoothstep(0.5,1.0,h));
        gl_FragColor = vec4(c,1.0); }`
    })
  );
  env.add(sky);
  const box = (w, h, col, k, pos) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide })
    );
    m.position.set(pos[0], pos[1], pos[2]);
    m.lookAt(0, 0, 0);
    env.add(m);
  };
  box(18, 12, 0xffffff, 3.0, [-14, 14, 18]);   // главный софтбокс спереди-сверху-слева
  box(6, 24, 0xbfe3ff, 4.0, [24, 4, 9]);        // холодная полоса справа
  box(9, 18, 0xffb070, 4.0, [-24, 2, -6]);      // тёплый контровой слева
  box(30, 6, 0xffffff, 3.0, [0, 28, -6]);       // верхняя полоса
  box(12, 12, 0xff7a9a, 2.0, [10, -9, -22]);    // розовый снизу-сзади
  box(5, 5, 0xffffff, 3.0, [8, 10, 22]);        // маленький яркий блик справа
  const pm = new THREE.PMREMGenerator(renderer);
  const rt = pm.fromScene(env, 0.02);
  pm.dispose();
  return rt.texture;
}
const envTex = buildEnvironment();
scene.environment = envTex;

/* =========================================================
   GLSL: noise + flame body deformation
   ========================================================= */
const NOISE_GLSL = `
vec3 mod289(vec3 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x - floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159 - 0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0,0.5,1.0,2.0);
  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);
  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);
  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;
  i = mod289(i);
  vec4 p = permute(permute(permute(
            i.z + vec4(0.0, i1.z, i2.z, 1.0))
          + i.y + vec4(0.0, i1.y, i2.y, 1.0))
          + i.x + vec4(0.0, i1.x, i2.x, 1.0));
  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;
  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);
  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;
  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);
  vec4 s0 = floor(b0)*2.0 + 1.0;
  vec4 s1 = floor(b1)*2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));
  vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);
  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
  m = m * m;
  return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
}`;

// Форма: капля с вытянутым острым языком; верх колышется, низ (где лицо) почти неподвижен.
const FLAME_GLSL = `
uniform float uTime;
${NOISE_GLSL}
vec3 flameDisp(vec3 p){
  float t = uTime;
  float y = p.y;
  float top = smoothstep(-0.1, 1.0, y);
  float taper = 1.0 - 0.62 * pow(top, 1.15);
  vec3 q = vec3(p.x*taper, y*(1.0 + 0.65*top), p.z*taper);
  float up = smoothstep(0.25, 1.0, y);
  float n1 = snoise(vec3(p.x*1.6, y*1.3 - t*1.4, p.z*1.6 + t*0.35));
  float n2 = snoise(vec3(p.x*2.4 + 7.0, y*2.0 - t*2.1, p.z*2.4));
  q.x += n1*0.16*up + sin(t*1.7 + y*2.0)*0.12*top*top;
  q.z += n2*0.12*up;
  q.y += n2*0.18*up*up;
  return q;
}
vec3 flameNormal(vec3 p){
  vec3 ax = abs(p.y) > 0.99 ? vec3(1.0,0.0,0.0) : vec3(0.0,1.0,0.0);
  vec3 t1 = normalize(cross(ax, p));
  vec3 t2 = cross(p, t1);
  float e = 0.02;
  vec3 s0 = flameDisp(p);
  vec3 s1 = flameDisp(p + t1*e);
  vec3 s2 = flameDisp(p + t2*e);
  return normalize(cross(s1 - s0, s2 - s0));
}`;

const timeU = { value: 0 };

// Те же формулы на CPU — чтобы лицо и аксессуары лежали точно на поверхности тела.
function shapeAt(p, out) {
  const top = ss(-0.1, 1.0, p.y);
  const tp = 1 - 0.62 * Math.pow(top, 1.15);
  return out.set(p.x * tp, p.y * (1 + 0.65 * top), p.z * tp);
}
function shapeNormal(p, out) {
  const ax = Math.abs(p.y) > 0.99 ? V3(1, 0, 0) : V3(0, 1, 0);
  const t1 = V3().crossVectors(ax, p).normalize();
  const t2 = V3().crossVectors(p, t1);
  const e = 0.02;
  const s0 = shapeAt(p, V3());
  const s1 = shapeAt(p.clone().addScaledVector(t1, e), V3());
  const s2 = shapeAt(p.clone().addScaledVector(t2, e), V3());
  return out.crossVectors(s1.sub(s0), s2.sub(s0)).normalize();
}
// u — азимут (вправо +), v — угол места (вверх +), off — отступ вдоль нормали
function surfacePoint(u, v, off = 0) {
  const cv = Math.cos(v);
  const p = V3(Math.sin(u) * cv, Math.sin(v), Math.cos(u) * cv);
  const s = shapeAt(p, V3());
  const n = shapeNormal(p, V3());
  return s.addScaledVector(n, off);
}

/* =========================================================
   Character hierarchy
   root (squash & stretch, jump) -> spin (swipe rotation, sway) -> body (sphere space, bottom at y=0 of root)
   ========================================================= */
const BASE_Y = -1.4;
const root = new THREE.Group();
root.position.y = BASE_Y;
scene.add(root);
const spin = new THREE.Group();
root.add(spin);
const body = new THREE.Group();
body.position.y = 1.0;
spin.add(body);

/* ---------- Liquid-glass body ---------- */
const rimU = { value: cur.rim };
const rimStrengthU = { value: 0.8 };

const glassMat = new THREE.MeshPhysicalMaterial({
  color: 0xffffff,
  metalness: 0,
  roughness: 0.08,
  transmission: 0.9,
  thickness: 1.5,
  ior: 1.5,
  dispersion: isMobile ? 0 : 0.6,
  attenuationColor: cur.tint.clone(),
  attenuationDistance: 1.5,
  clearcoat: 1,
  clearcoatRoughness: 0.04,
  specularIntensity: 1,
  envMap: envTex,
  envMapIntensity: 1.1,
  emissive: cur.outer.clone(),
  emissiveIntensity: 0.04
});
glassMat.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = timeU;
  shader.uniforms.uRimColor = rimU;
  shader.uniforms.uRimStrength = rimStrengthU;
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', '#include <common>\n' + FLAME_GLSL)
    .replace('#include <beginnormal_vertex>',
      'vec3 objectNormal = flameNormal(position);\n#ifdef USE_TANGENT\nvec3 objectTangent = vec3(tangent.xyz);\n#endif')
    .replace('#include <begin_vertex>', 'vec3 transformed = flameDisp(position);');
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', '#include <common>\nuniform vec3 uRimColor;\nuniform float uRimStrength;')
    .replace('#include <emissivemap_fragment>',
      `#include <emissivemap_fragment>
       {
         float fr = pow(1.0 - saturate(dot(normalize(normal), normalize(vViewPosition))), 2.4);
         totalEmissiveRadiance += uRimColor * fr * uRimStrength;
       }`);
};
glassMat.customProgramCacheKey = () => 'flameGlass_v1';

const bodyMesh = new THREE.Mesh(
  new THREE.SphereGeometry(1, isMobile ? 96 : 160, isMobile ? 72 : 120),
  glassMat
);
bodyMesh.frustumCulled = false;
body.add(bodyMesh);

/* ---------- Fire core ---------- */
const coreU = {
  uTime: timeU,
  uInner: { value: cur.inner },
  uOuter: { value: cur.outer },
  uScale: { value: 0.55 },
  uOffY: { value: -0.12 },
  uPulse: { value: 0 }
};
const coreMat = new THREE.ShaderMaterial({
  uniforms: coreU,
  vertexShader: `
    ${FLAME_GLSL}
    uniform float uScale; uniform float uOffY;
    varying vec3 vN; varying float vY;
    void main(){
      vec3 q = flameDisp(position) * uScale + vec3(0.0, uOffY, -0.2);
      vN = normalize(normalMatrix * normal);
      vY = position.y;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(q, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 uInner; uniform vec3 uOuter; uniform float uPulse;
    varying vec3 vN; varying float vY;
    void main(){
      float f = clamp(normalize(vN).z, 0.0, 1.0);
      float c = pow(f, 1.4);
      float low = 1.0 - smoothstep(-1.0, 1.0, vY);
      float k = clamp(c*0.85 + low*0.2, 0.0, 1.0);
      vec3 col = mix(uOuter, uInner, k);
      col += uInner * pow(f, 6.0) * 0.2;
      col *= 0.9 + 0.3*uPulse;
      gl_FragColor = vec4(col, 1.0);
    }`
});
const core = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), coreMat);
core.frustumCulled = false;
body.add(core);

/* ---------- Lights ---------- */
const coreLight = new THREE.PointLight(0xff8a3a, 9, 7, 2);
coreLight.position.set(0, 0.1, 0.2);
body.add(coreLight);
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(-3, 4, 5);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0xffffff, 1.0);
rimLight.position.set(4, 2, -4);
scene.add(rimLight);
scene.add(new THREE.AmbientLight(0x404060, 0.35));

/* =========================================================
   Face (procedural canvas textures, wrapped onto the body surface)
   ========================================================= */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasTex(c) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;

function makeDecal(tex, u0, v0, w, h, off, opts = {}) {
  const g = new THREE.PlaneGeometry(w, h, 14, 14);
  const pos = g.attributes.position;
  const C = surfacePoint(u0, v0, off);
  for (let i = 0; i < pos.count; i++) {
    const P = surfacePoint(u0 + pos.getX(i), v0 + pos.getY(i), off);
    pos.setXYZ(i, P.x - C.x, P.y - C.y, P.z - C.z);
  }
  g.computeBoundingSphere();
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide,
    color: new THREE.Color(opts.color || 0xffffff).multiplyScalar(opts.mult || 1)
  }));
  m.position.copy(C);
  m.renderOrder = opts.order || 10;
  m.frustumCulled = false;
  return m;
}

/* ---------- Sunglasses (обёрнуты по поверхности тела) ---------- */
function lensOutline(a, hw, hh) {
  const c = Math.cos(a), s = Math.sin(a);
  let x = hw * Math.sign(c) * Math.pow(Math.abs(c), 0.62);
  const y = hh * Math.sign(s) * Math.pow(Math.abs(s), 0.62);
  if (s < 0) x *= 1 + 0.22 * s;       // низ линзы уже — форма «вайфарер»
  return [x, y];
}
function buildLens(cu, cv, hw, hh, off) {
  const g = new THREE.PlaneGeometry(2, 2, 20, 14);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const gx = pos.getX(i), gy = pos.getY(i);
    const m = Math.max(Math.abs(gx), Math.abs(gy));
    const len = Math.hypot(gx, gy);
    let ux = 0, uy = 0;
    if (len > 1e-6) { ux = gx * m / len; uy = gy * m / len; }
    const a = Math.atan2(uy, ux);
    const o = lensOutline(a, hw, hh);
    const r = Math.hypot(ux, uy);
    const P = surfacePoint(cu + r * o[0], cv + r * o[1], off);
    pos.setXYZ(i, P.x, P.y, P.z);
  }
  g.computeVertexNormals();
  return g;
}
function buildFrame(cu, cv, hw, hh, thick, off) {
  const n = 72, pts = [], idx = [];
  for (let i = 0; i <= n; i++) {
    const a = i / n * TAU;
    const o1 = lensOutline(a, hw, hh), o2 = lensOutline(a, hw + thick, hh + thick);
    const A = surfacePoint(cu + o1[0], cv + o1[1], off);
    const B = surfacePoint(cu + o2[0], cv + o2[1], off);
    pts.push(A.x, A.y, A.z, B.x, B.y, B.z);
  }
  for (let i = 0; i < n; i++) {
    const a = 2 * i, b = 2 * i + 1, c = 2 * i + 2, d = 2 * i + 3;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
function surfaceTube(points, radius) {
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 28, radius, 8, false);
}

const glasses = new THREE.Group();
(function buildGlasses() {
  const G_V = 0.09, G_U = 0.31, HW = 0.26, HH = 0.19;
  const lensMat = new THREE.MeshStandardMaterial({
    color: 0x05060a, metalness: 0.65, roughness: 0.05, envMap: envTex, envMapIntensity: 2.4,
    transparent: true, opacity: 0.95, side: THREE.DoubleSide
  });
  const geos = [];
  const add = (geo, mat, order) => { const m = new THREE.Mesh(geo, mat); m.renderOrder = order || 0; m.frustumCulled = false; geos.push(m); return m; };

  [-1, 1].forEach(sg => {
    add(buildLens(sg * G_U, G_V, HW, HH, 0.05), lensMat, 14);
    add(buildFrame(sg * G_U, G_V, HW, HH, 0.035, 0.056), goldMat, 15);
  });
  const bridgePts = [];
  for (let i = 0; i <= 6; i++) {
    const u = -0.08 + i / 6 * 0.16;
    bridgePts.push(surfacePoint(u, 0.125 + 0.018 * Math.sin(i / 6 * Math.PI), 0.062));
  }
  add(surfaceTube(bridgePts, 0.014), goldMat, 15);
  [-1, 1].forEach(sg => {
    const pts = [];
    for (let i = 0; i <= 10; i++) {
      const u = sg * (G_U + HW + 0.03 + i / 10 * 0.95);
      pts.push(surfacePoint(u, 0.11, 0.055));
    }
    add(surfaceTube(pts, 0.013), goldMat, 15);
  });
  // pivot в центре лица, чтобы очки «выпрыгивали» на месте
  const pivot = surfacePoint(0, G_V, 0.05);
  geos.forEach(m => { m.geometry.translate(-pivot.x, -pivot.y, -pivot.z); glasses.add(m); });
  glasses.position.copy(pivot);
})();

/* =========================================================

   ========================================================= */
const SPARKS = 56;
const sp = {
  age: new Float32Array(SPARKS), life: new Float32Array(SPARKS), ang: new Float32Array(SPARKS),
  rad: new Float32Array(SPARKS), h0: new Float32Array(SPARKS), rise: new Float32Array(SPARKS),
  om: new Float32Array(SPARKS), seed: new Float32Array(SPARKS), size: new Float32Array(SPARKS)
};
const sparkPos = new Float32Array(SPARKS * 3);
const sparkAlpha = new Float32Array(SPARKS);
const sparkSize = new Float32Array(SPARKS);
const sparkMix = new Float32Array(SPARKS);
function spawnSpark(i, burst = false) {
  sp.life[i] = 1.8 + Math.random() * 2.2;
  sp.age[i] = burst ? 0 : Math.random() * sp.life[i];
  sp.ang[i] = Math.random() * TAU;
  sp.rad[i] = 0.5 + Math.random() * 0.55 + (burst ? 0.1 : 0);
  sp.h0[i] = 0.2 + Math.random() * 1.5;
  sp.rise[i] = (0.45 + Math.random() * 0.8) * (burst ? 1.8 : 1);
  sp.om[i] = (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 1.2);
  sp.seed[i] = Math.random() * 100;
  sp.size[i] = 0.06 + Math.random() * 0.1;
  sparkMix[i] = Math.random();
}
for (let i = 0; i < SPARKS; i++) spawnSpark(i);
function burst(n) {
  for (let k = 0; k < n; k++) spawnSpark((Math.random() * SPARKS) | 0, true);
}
const sparkGeo = new THREE.BufferGeometry();
sparkGeo.setAttribute('position', new THREE.BufferAttribute(sparkPos, 3));
sparkGeo.setAttribute('aAlpha', new THREE.BufferAttribute(sparkAlpha, 1));
sparkGeo.setAttribute('aSize', new THREE.BufferAttribute(sparkSize, 1));
sparkGeo.setAttribute('aMix', new THREE.BufferAttribute(sparkMix, 1));
const sparkMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uScale: { value: 800 }, uColA: { value: cur.sA }, uColB: { value: cur.sB } },
  vertexShader: `
    attribute float aAlpha; attribute float aSize; attribute float aMix;
    uniform float uScale; varying float vA; varying float vM;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = max(1.0, aSize * uScale / -mv.z);
      vA = aAlpha; vM = aMix;
    }`,
  fragmentShader: `
    uniform vec3 uColA; uniform vec3 uColB; varying float vA; varying float vM;
    void main(){
      float r = length(gl_PointCoord - 0.5) * 2.0;
      if (r > 1.0) discard;
      float core = exp(-r*r*6.0);
      float glow = pow(1.0 - r, 2.0);
      vec3 c = mix(uColA, uColB, vM) * 2.4;
      c = mix(c, vec3(2.6), core * 0.55);
      float a = clamp(glow*0.8 + core, 0.0, 1.0) * vA;
      gl_FragColor = vec4(c, a);
    }`
});
const sparkPoints = new THREE.Points(sparkGeo, sparkMat);
sparkPoints.frustumCulled = false;
sparkPoints.renderOrder = 20;
scene.add(sparkPoints);

function updateSparks(dt, jy) {
  for (let i = 0; i < SPARKS; i++) {
    sp.age[i] += dt;
    if (sp.age[i] >= sp.life[i]) spawnSpark(i);
    const age = sp.age[i], k = age / sp.life[i], s = sp.seed[i];
    const a = sp.ang[i] + sp.om[i] * age;
    const r = sp.rad[i] * (1 + 0.25 * k) + 0.12 * Math.sin(s + age * 2.5);
    const x = Math.cos(a) * r + Math.sin(age * 3.1 + s) * 0.1 * k;
    const z = Math.sin(a) * r + Math.cos(age * 2.7 + s * 1.3) * 0.1 * k;
    const y = sp.h0[i] + sp.rise[i] * age + Math.sin(age * 4.3 + s * 0.7) * 0.06;
    sparkPos[i * 3] = x;
    sparkPos[i * 3 + 1] = BASE_Y + y + jy * 0.8;
    sparkPos[i * 3 + 2] = z;
    sparkAlpha[i] = ss(0, 0.12, k) * (1 - ss(0.5, 1, k));
    sparkSize[i] = sp.size[i] * (1 - 0.55 * k);
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.aAlpha.needsUpdate = true;
  sparkGeo.attributes.aSize.needsUpdate = true;
  sparkGeo.attributes.aMix.needsUpdate = true;
}

const hintEl = document.getElementById('hint');
let rotY = 0, spinV = 0, dragging = false, idleT = 0;
let startX = 0, startY = 0, lastX = 0, downT = 0, lastMoveT = 0;

// прыжок / squash & stretch
let jy = 0, jv = 0, air = false, launchDelay = 0, sq = 0, sv = 0;

function tap() {
  haptic('medium');
  hintEl.classList.add('off');
  if (!air && launchDelay <= 0) { sv = -3.6; launchDelay = 0.09; }
  else if (air) { jv = Math.max(jv, 3.8); sv += 2.5; burst(8); }
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  dragging = true; startX = lastX = e.clientX; startY = e.clientY;
  downT = lastMoveT = performance.now(); spinV = 0;
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dx = e.clientX - lastX; lastX = e.clientX;
  rotY += dx * 0.011;
  const dtm = Math.max((now - lastMoveT) / 1000, 0.008);
  spinV = clamp(spinV * 0.6 + (dx * 0.011 / dtm) * 0.4, -14, 14);
  lastMoveT = now;
});
const endDrag = e => {
  if (!dragging) return;
  dragging = false;
  const now = performance.now();
  const moved = Math.hypot(e.clientX - startX, e.clientY - startY);
  if (moved < 10 && now - downT < 450) tap();
  if (now - lastMoveT > 90) spinV = 0;
  if (moved >= 10) hintEl.classList.add('off');
  idleT = 0;
};
canvas.addEventListener('pointerup', endDrag);

  const a = ACC[b.dataset.acc];
  a.on = !a.on;
  b.classList.toggle('on', a.on);
  b.setAttribute('aria-pressed', String(a.on));
  hapticSelect();
  sv += 1.5;
}));

/* ---------- Resize ---------- */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(DPR);
  renderer.setSize(w, h, false);
  composer.setPixelRatio(DPR);
  composer.setSize(w, h);
  camera.aspect = w / h;
  const dist = Math.max(7.6, 3.9 / camera.aspect);
  const lookY = -0.4;
  camera.position.set(0, lookY + 0.55, dist);
  camera.lookAt(0, lookY, 0);
  camera.updateProjectionMatrix();
  sparkMat.uniforms.uScale.value = (h * DPR) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
if (tg && tg.onEvent) tg.onEvent('viewportChanged', resize);
resize();

/* =========================================================
   Animation loop
   ========================================================= */
let t = 0, last = performance.now();
let nextBlink = 3 + Math.random() * 2, blinkP = -1;
let firstFrame = true;

renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; t += dt; timeU.value = t;

  // плавный переход цветов скина
  const kc = 1 - Math.exp(-dt * 4);
  COLOR_KEYS.forEach(k => cur[k].lerp(tgt[k], kc));
  glassMat.color.set(0xffffff).lerp(cur.tint, 0.22);
  glassMat.attenuationColor.copy(cur.tint);
  glassMat.emissive.copy(cur.outer);
  coreLight.color.copy(cur.light);
  bgMat.color.copy(cur.bg);
  groundMat.color.copy(cur.rim);
  rimLight.color.copy(cur.rim).lerp(new THREE.Color(0xffffff), 0.4);

  // вращение свайпом + инерция + возврат лицом к зрителю
  if (!dragging) {
    rotY += spinV * dt;
    spinV *= Math.exp(-dt * 2.2);
    idleT += dt;
    if (idleT > 1.6 && Math.abs(spinV) < 0.8) {
      const target = Math.round(rotY / TAU) * TAU;
      rotY += (target - rotY) * (1 - Math.exp(-dt * 2.5));
    }
  } else idleT = 0;
  const lean = clamp(spinV * 0.012, -0.25, 0.25);
  spin.rotation.y = rotY + Math.sin(t * 0.6) * 0.14;
  spin.rotation.z = Math.sin(t * 1.3) * 0.04 - lean;
  spin.rotation.x = Math.sin(t * 0.9) * 0.025;

  // прыжок + squash & stretch
  if (launchDelay > 0) {
    launchDelay -= dt;
    if (launchDelay <= 0) { jv = 4.4; sv += 7; air = true; burst(14); }
  }
  if (air) {
    jv -= 17 * dt; jy += jv * dt;
    if (jy <= 0 && jv < 0) { jy = 0; sv -= Math.min(-jv, 5) * 1.4; jv = 0; air = false; haptic('light'); }
  }
  sv += (-110 * sq - 10 * sv) * dt;
  sq = clamp(sq + sv * dt, -0.42, 0.38);
  const stretch = air ? clamp(jv * 0.03, -0.1, 0.14) : 0;
  const breathe = Math.sin(t * 2.2) * 0.02;
  const sy = 1 + sq + stretch - breathe;
  const sxz = 1 - sq * 0.5 - stretch * 0.5 + breathe * 0.6;
  root.scale.set(sxz, sy, sxz);
  root.position.y = BASE_Y + jy;
  const gs = 1 / (1 + jy * 0.9);
  ground.scale.set(gs, 1, gs);
  groundMat.opacity = 0.8 * gs;

  // пульс ядра
  const pulse = 0.5 + 0.5 * Math.sin(t * 3.0) * 0.6 + 0.2 * Math.sin(t * 7.1);
  coreU.uPulse.value = pulse;
  const cs = 1 + 0.05 * Math.sin(t * 3.0);
  core.scale.setScalar(cs);

  // моргание каждые 4–6 секунд
  if (blinkP < 0 && t >= nextBlink) blinkP = 0;
  if (blinkP >= 0) {
    blinkP += dt / 0.2;
    const sy2 = 1 - 0.92 * Math.sin(Math.PI * Math.min(blinkP, 1));
    eyeL.scale.y = eyeR.scale.y = sy2;
    if (blinkP >= 1) { blinkP = -1; nextBlink = t + 4 + Math.random() * 2; eyeL.scale.y = eyeR.scale.y = 1; }
  }

  // аксессуары: пружины появления + следование за раскачиванием языка пламени
  for (const a of Object.values(ACC)) {
    const target = a.on ? 1 : 0;
    a.v += ((target - a.x) * 170 - a.v * 13) * dt;
    a.x += a.v * dt;
    const s = Math.max(a.x, 0);
    a.obj.visible = s > 0.004 || a.on;
    a.obj.scale.setScalar(Math.max(s, 0.0001));
  }
  const swayAt = (y, top) => Math.sin(t * 1.7 + y * 2.0) * 0.12 * top * top;
  const crownTop = ss(-0.1, 1.0, CROWN_SPH_Y);
  const cx = swayAt(CROWN_SPH_Y, crownTop);
  crown.position.x = cx;
  crown.rotation.z = -cx * 0.5;
  haloHolder.position.set(swayAt(1.0, 1.0) * 1.1, 2.05 + Math.sin(t * 2.2) * 0.04, 0);
  halo.rotation.z = Math.sin(t * 1.3) * 0.05;

  updateSparks(dt, jy);
  stars.material.opacity = 0.7 + 0.15 * Math.sin(t * 1.3);

  composer.render(dt);

  if (firstFrame) {
    firstFrame = false;
    document.getElementById('loader').classList.add('off');
    setTimeout(() => hintEl.classList.add('off'), 6000);
  }
});
</script>
</body>
</html>
