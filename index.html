<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Огонёк 3D</title>
  <!-- Подключение Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- 3D-библиотека Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at center, #1e0d36 0%, #080312 100%);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #canvas3d { width: 100vw; height: 100vh; display: block; }
    
    /* Стеклянные плашки (Liquid Glassmorphism) */
    .glass-panel {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    
    .header {
      top: 16px; left: 16px; right: 16px;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 10;
    }
    .header h1 { font-size: 18px; font-weight: 700; color: #ff9d00; text-shadow: 0 0 12px rgba(255,157,0,0.5); }
    .header span { font-size: 13px; opacity: 0.8; }
    
    .controls {
      bottom: 24px; left: 16px; right: 16px;
      padding: 16px;
      display: flex; flex-direction: column; gap: 10px;
      z-index: 10;
    }
    .btn-row { display: flex; gap: 8px; justify-content: center; }
    .btn {
      flex: 1;
      padding: 10px 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .btn:active, .btn.active {
      background: linear-gradient(135deg, #ff7b00, #ff0055);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(0.96);
    }
    .hint {
      position: absolute;
      top: 80px; left: 0; right: 0;
      text-align: center;
      font-size: 12px;
      opacity: 0.5;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="glass-panel header">
    <h1>🔥 Огонёк 3D</h1>
    <span id="streakDays">Твой питомец</span>
  </div>

  <div class="hint">Вращай пальцем или нажимай на пламя ✨</div>

  <canvas id="canvas3d"></canvas>

  <div class="glass-panel controls">
    <div class="btn-row">
      <button class="btn active" onclick="setSkin('classic')">🔥 Огонь</button>
      <button class="btn" onclick="setSkin('neon')">⚡ Неон</button>
      <button class="btn" onclick="setSkin('ice')">❄️ Лёд</button>
      <button class="btn" onclick="setSkin('phoenix')">👑 Феникс</button>
    </div>
    <div class="btn-row">
      <button class="btn" id="accGlasses" onclick="toggleAcc('glasses')">🕶 Очки</button>
      <button class="btn" id="accCrown" onclick="toggleAcc('crown')">👑 Корона</button>
      <button class="btn" id="accHalo" onclick="toggleAcc('halo')">😇 Нимб</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 5.5);

    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xff7700, 3, 10);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    const topLight = new THREE.DirectionalLight(0xffffff, 2.5);
    topLight.position.set(2, 5, 3);
    scene.add(topLight);

    const flameRoot = new THREE.Group();
    scene.add(flameRoot);

    // 1. Внутреннее горящее ядро
    const coreGeo = new THREE.SphereGeometry(0.65, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
    const flameCore = new THREE.Mesh(coreGeo, coreMat);
    flameRoot.add(flameCore);

    // 2. Внешняя оболочка: жидкое стекло
    const glassGeo = new THREE.SphereGeometry(1.0, 64, 64);
    const pos = glassGeo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      let y = pos.getY(i);
      if (y > 0) {
        let f = 1.0 - (y * 0.42);
        pos.setX(i, pos.getX(i) * f);
        pos.setZ(i, pos.getZ(i) * f);
        pos.setY(i, y * 1.35);
      }
    }
    glassGeo.computeVertexNormals();

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffaa00,
      roughness: 0.1,
      metalness: 0.1,
      transmission: 0.85,
      ior: 1.5,
      transparent: true,
      opacity: 0.95
    });
    const glassFlame = new THREE.Mesh(glassGeo, glassMat);
    flameRoot.add(glassFlame);

    // 3. Глазки
    const eyeGeo = new THREE.SphereGeometry(0.12, 16, 16);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.35, 0.1, 0.9);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.35, 0.1, 0.9);
    flameRoot.add(leftEye);
    flameRoot.add(rightEye);

    // 4. Аксессуары
    const glassesGroup = new THREE.Group();
    const gFrameGeo = new THREE.BoxGeometry(1.1, 0.22, 0.1);
    const gFrameMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
    glassesGroup.add(new THREE.Mesh(gFrameGeo, gFrameMat));
    glassesGroup.position.set(0, 0.1, 1.05);
    glassesGroup.visible = false;
    flameRoot.add(glassesGroup);

    const crownGroup = new THREE.Group();
    const crownGeo = new THREE.CylinderGeometry(0.4, 0.35, 0.35, 5, 1, true);
    const crownMat = new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.8, roughness: 0.2 });
    crownGroup.add(new THREE.Mesh(crownGeo, crownMat));
    crownGroup.position.set(0, 1.35, 0);
    crownGroup.visible = false;
    flameRoot.add(crownGroup);

    const haloGeo = new THREE.TorusGeometry(0.5, 0.05, 16, 32);
    const haloMat = new THREE.MeshBasicMaterial({ color: 0xffee44 });
    const haloMesh = new THREE.Mesh(haloGeo, haloMat);
    haloMesh.rotation.x = Math.PI / 2;
    haloMesh.position.set(0, 1.55, 0);
    haloMesh.visible = false;
    flameRoot.add(haloMesh);

    // 5. Искры
    const pCount = 45;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    for (let i = 0; i < pCount * 3; i += 3) {
      pPos[i] = (Math.random() - 0.5) * 1.5;
      pPos[i+1] = (Math.random() - 0.5) * 2;
      pPos[i+2] = (Math.random() - 0.5) * 1.5;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.06, transparent: true, opacity: 0.7 });
    const particles = new THREE.Points(pGeo, pMat);
    flameRoot.add(particles);

    // Управление жестами
    let isDragging = false, prevX = 0, prevY = 0, targetRotY = 0, targetRotX = 0;
    window.addEventListener('pointerdown', (e) => {
      isDragging = true;
      prevX = e.clientX; prevY = e.clientY;
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      flameRoot.scale.set(1.15, 0.88, 1.15);
      setTimeout(() => flameRoot.scale.set(1, 1, 1), 160);
    });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      targetRotY += (e.clientX - prevX) * 0.01;
      targetRotX += (e.clientY - prevY) * 0.01;
      prevX = e.clientX; prevY = e.clientY;
    });
    window.addEventListener('pointerup', () => isDragging = false);

    const skins = {
      classic: { glass: 0xff9900, core: 0xff2200, light: 0xff7700 },
      neon:    { glass: 0x00f0ff, core: 0x9900ff, light: 0x00d4ff },
      ice:     { glass: 0x88e5ff, core: 0x0077ff, light: 0x66ccff },
      phoenix: { glass: 0xffd700, core: 0xff0044, light: 0xffaa00 }
    };

    function setSkin(type) {
      const s = skins[type];
      glassMat.color.setHex(s.glass);
      coreMat.color.setHex(s.core);
      pointLight.color.setHex(s.light);
      pMat.color.setHex(s.glass);
      document.querySelectorAll('.btn-row:first-child .btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function toggleAcc(type) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      if (type === 'glasses') glassesGroup.visible = !glassesGroup.visible;
      if (type === 'crown') crownGroup.visible = !crownGroup.visible;
      if (type === 'halo') haloMesh.visible = !haloMesh.visible;
      event.target.classList.toggle('active');
    }

    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      flameRoot.position.y = Math.sin(t * 2) * 0.12;
      const pulse = 1 + Math.sin(t * 4) * 0.05;
      flameCore.scale.set(pulse, pulse, pulse);

      flameRoot.rotation.y += (targetRotY - flameRoot.rotation.y) * 0.1;
      flameRoot.rotation.x += (targetRotX - flameRoot.rotation.x) * 0.1;
      if (!isDragging) targetRotY += 0.005;

      const pArr = pGeo.attributes.position.array;
      for (let i = 1; i < pCount * 3; i += 3) {
        pArr[i] += 0.015;
        if (pArr[i] > 1.8) pArr[i] = -0.5;
      }
      pGeo.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
